# project.yml — ความจำร่วมของทุกบทบาทในสายงาน
#
# ทุก skill อ่านไฟล์นี้ก่อนเริ่มงาน และเขียนกลับเมื่อได้คำตอบใหม่
# กติกา — ไม่รู้ให้เขียน  TBD — ต้องการ [คน/ข้อมูล]  ห้ามเว้นว่าง ห้ามเดา
# ตัวเลขที่เดา ให้บันทึกไว้ใต้ assumptions ด้วย

meta:
  name: WealthPlaner           # ชื่อโครงการ
  code: WPN                    # รหัสสามตัวอักษรพิมพ์ใหญ่ ใช้แทน XXX ในรหัสเอกสาร
  owner: TBD — ต้องการ [ชื่อเจ้าของโครงการ]   # ชื่อนักเรียนเจ้าของโครงการ
  mode: solo                   # solo = คนเดียวเล่นครบทุกบทบาท
  started: 2026-08-22          # YYYY-MM-DD
  language: th                 # ภาษาของเอกสารส่งมอบ

# ระยะปัจจุบันของโครงการ — มีเพียง /gate เท่านั้นที่เลื่อนค่านี้
# intake → product → analysis → design → build → review → quality → release
stage: quality

problem:
  statement: รวบรวมสินทรัพย์จากทุกพอร์ตการลงทุนไว้ที่เดียว เพื่อทำ asset allocation และดูภาพ income/outcome   # ปัญหาในหนึ่งประโยค เขียนเป็นปัญหา ไม่ใช่วิธีแก้
  users: บุคคลที่ต้องการเห็นภาพรวมพอร์ตการลงทุนรวมของตนเอง   # ใครเจอปัญหานี้ ระบุให้เจาะจงกว่าคำว่า "ผู้ใช้"
  frequency: รวบรวมข้อมูลพอร์ตเดือนละ 1 ครั้ง และปรับ/rebalance allocation ทุก 6 เดือน–1 ปี   # เจอบ่อยแค่ไหน
  today_workaround: จดและติดตามพอร์ตด้วย Excel เอง (ไฟล์เก็บบน Google Drive) จดทั้งราคาต้นทุนและราคาตลาดด้วยมือ   # วันนี้เขาทำยังไงเมื่อยังไม่มีของชิ้นนี้
  cost: ต้องทำ manual ทุกอย่าง — จดราคาต้นทุนและราคาตลาดเอง รวบรวมเดือนละครั้ง เสียเวลาและเสี่ยงผิดพลาด และเข้าไม่ถึงคำปรึกษามืออาชีพ เพราะที่ปรึกษา personal wealth ของโบรกจะให้บริการเฉพาะผู้มีสินทรัพย์ ~2 ล้านบาทขึ้นไปในโบรกนั้น ทำให้คนที่กระจายพอร์ตหลายโบรกหรือเงินยังไม่ถึงเกณฑ์ ไม่มีที่ปรึกษาที่มองพอร์ตรวมได้   # ไม่แก้แล้วเสียอะไร

outcome:
  metric: เวลาที่ใช้รวบรวมและอัปเดตพอร์ตรวมต่อเดือน (นาที/เดือน)   # วัดด้วยอะไร ต้องเป็นตัวเลขที่ลดลงได้ ไม่ใช่ "engagement เพิ่ม"
  baseline: 30–60 นาที/เดือน (ประมาณการ ยังไม่จับเวลาจริง — ดู assumptions)   # วันนี้ค่าเท่าไหร่
  target: < 10 นาที/เดือน ([ข้อเสนอ PO] overrule ได้)     # อยากให้เป็นเท่าไหร่
  measured_by: เจ้าของโครงการ วัดเองก่อน-หลังใช้ระบบ       # ใครวัด วัดเมื่อไหร่

scope:
  in:                         # อยู่ในขอบเขตรอบนี้ (ข้อเสนอ PO ใน PRD-WPN-001 รอ sign-off)
    - บันทึกสินทรัพย์หลายรายการข้ามโบรก พร้อมระบุ+แสดง broker channel (REQ-01)
    - แสดงพอร์ตรวมและสัดส่วน asset allocation (REQ-02)
    - ดึง/อัปเดตราคาตลาดที่รองรับ + กรอกมือส่วนที่เหลือ (REQ-03)
    - คำนวณ income/outcome เทียบราคาต้นทุน (REQ-04)
  out:                        # ตัดออกอย่างชัดเจน (ข้อเสนอ PO)
    - ซื้อ/ขายหลักทรัพย์อัตโนมัติ และการเชื่อมบัญชีเพื่อทำธุรกรรมจริง
    - ผู้ช่วย AI ที่ปรึกษา (REQ-07) — เลื่อนออกจากรอบนี้ตามที่เจ้าของโครงการตัดสิน
    - การวางแผนภาษี/มรดก
    - การรับประกันเชื่อมต่ออัตโนมัติกับทุกโบรก
  constraints:
    - ไม่มีเดดไลน์ตายตัว
    - ทำคนเดียว (solo)
  approver: TBD — ต้องการ [ผู้อนุมัติขอบเขต]         # ใครเซ็นอนุมัติขอบเขต

delivery:
  people: 1 คน (ทำคนเดียว)                          # มีใครทำบ้าง กี่คน
  days_available: TBD — ต้องการ [วันทำงานจริงต่อสัปดาห์]   # วันทำงานจริงที่มี หักลาและประชุมแล้ว
  iteration_length: TBD — ต้องการ [ความยาวรอบทำงาน]   # รอบทำงานยาวเท่าไหร่
  hard_deadline: ไม่มี                              # เดดไลน์ที่ขยับไม่ได้ ถ้าไม่มีให้เขียนว่าไม่มี

technical:
  data_location: ฐานข้อมูลเฉพาะ (ไฮบริดตาม ADR-001) + Google Sheet เป็น import/export · auth ผ่าน LINE+Google (CR-WPN-001)   # ข้อมูลอยู่ที่ไหน เครื่องผู้ใช้ เซิร์ฟเวอร์ หรือทั้งสอง
  offline: ไม่จำเป็น — ใช้ผ่านเว็บ/LINE OA ต้องออนไลน์ ([ข้อเสนอ PO] จากบริบทการใช้งาน)   # ต้องใช้งานตอนไม่มีเน็ตไหม
  integrations:               # ต่อกับระบบอะไรบ้าง
    - ราคาหุ้นไทย — settrade (SET)
    - ราคาหุ้นต่างประเทศ — investing.com
    - ราคาทองไทย
    - อัตราแลกเปลี่ยน — Google source (อัปเดตทุก 15 นาที)
    - LINE OA (ช่องทางเข้าใช้งาน)
  stack: "Next.js (TypeScript/React) + Supabase (Postgres + Auth + Row-Level Security + Edge Functions/cron ดึงราคา+FX ทุก 15 นาที) · web responsive เข้าผ่าน LINE OA · Google Sheet import ผ่าน API — เลือกโดยเจ้าของโครงการ 2026-08-29 (ปิด B3) · รอ system-analyst formalize เป็น ADR-002"   # ภาษาและเฟรมเวิร์ก
  existing_code: ไม่มี — ปัจจุบันใช้ Excel/Google Sheet   # มีโค้ดเดิมไหม อยู่ที่ไหน

design:
  brand: "Neon Dark (designops) — เลือกโดยเจ้าของ 2026-08-29 · พื้น #0E0A1C การ์ด #181330 · primary ม่วง #564CF8 · accent ไลม์ #C1FD42 · highlight ชมพู #F982FB · กำไร #3DDC84 ▲ / ขาดทุน #FF6B6B ▼ (คู่ ▲▼ +/− เสมอ colorblind-safe) · ฟอนต์ IBM Plex Sans Thai (tabular figures) · หลีกเลี่ยงลาย AI (gradient/glass พร่ำเพรื่อ, จัดกลางทุกอย่าง, emoji เป็น icon) · รายละเอียด token เต็มใน DSN-WPN-001"   # โทน สี ตัวอักษร ถ้ามีคู่มือแบรนด์ให้ชี้ที่อยู่
  devices:                    # อุปกรณ์เป้าหมาย
    - mobile
    - tablet
    - desktop (web responsive)
  existing_system: เริ่มจากศูนย์ — ไม่มี design system/brand guide เดิม สร้าง token+component ชุดใหม่ทั้งหมดใน DSN-WPN-001   # มี design system เดิมไหม หรือเริ่มจากศูนย์

build:
  # เกณฑ์ว่างานหนึ่งชิ้นเสร็จ — [ข้อเสนอ commander เจ้าของ overrule ได้] · เต็มรูปแบบดู .claude/skills/developer/assets/definition-of-done.md
  definition_of_done:
    - AC ทุกข้อของ story สาธิตผ่านได้จริง และครอบคลุม unhappy path อย่างน้อย 1 เคส
    - test case ใน TST-WPN-001 ที่เกี่ยวข้องกับ story ผ่านครบ
    - มี test สำหรับพฤติกรรมใหม่ และ test พังถ้าเอาโค้ดออก · ชุดเทสต์ทั้งหมดผ่าน ไม่มี warning ใหม่ใน console
    - ทุกหน้าจอมี state ครบ — ว่าง / กำลังโหลด / ผิดพลาด / ไม่มีสิทธิ์ (ตาม REQ ข้อ 8)
    - ใช้ design token จาก DSN ไม่ hardcode สี/ระยะ · ถูกต้องทุก breakpoint (mobile/tablet/desktop) และเปิดผ่าน LINE OA in-app browser ได้ (NFR-05)
    - คีย์บอร์ดเข้าถึงครบ มีขอบโฟกัสที่มองเห็น · ผ่าน WCAG 2.1 AA (NFR-02)
    - ตัวเลขการเงินถูกต้อง — income/outcome, %, กันหารศูนย์เมื่อ cost=0, แปลง FX, ตรรกะ stale 15 นาที (BR-01..BR-05)
    - ตารางสอบทานย้อนกลับระบุแล้วว่าโค้ดนี้ทำตาม requirement/AC ข้อไหน
    - assumptions และคำถามที่ค้างบันทึกใน project.yml แล้ว · เอกสารต้นทางที่ขัดกันออกเป็น /cr แล้ว
    - อ่าน diff ตัวเองครบเหมือนงานคนอื่น · ไม่มี console.log/โค้ดทดลองค้าง · commit แยกเหตุผลละอัน
  branch_convention: "feature/<story>-<slug> เช่น feature/F001-add-asset · fix/<slug> · [ข้อเสนอ commander overrule ได้]"   # ตั้งชื่อ branch ยังไง
  # ความคืบหน้า build — ให้ commander/developer อ่านก่อนเดินต่อ ไม่ทำซ้ำ
  progress:
    stack: "scaffold Next.js 14 (App Router) + React 18 + TS + lucide-react + tokens.css (Neon Dark) + IBM Plex Sans Thai (next/font) · next build ผ่าน"
    logic: "F001–F007 business rules เสร็จ — 6 lib modules (finance/asset/portfolio/rebalance/import/risk) · asset.ts +ASSET_TYPE_LABELS/draftToDisplayAsset · 33/33 tests ผ่าน"
    screens_done:
      - "F002 Portfolio — app/page.tsx ต่อ portfolio.ts/finance.ts จริง (mock data) · รันได้ที่ :3200"
      - "F001 Add Asset — app/add/page.tsx ต่อ validateAssetDraft/isDuplicate/draftToDisplayAsset จริง · AC-01/E01–E04 (inline error + focus ช่องแรก + ยืนยันซ้ำ + สถานะกำลังบันทึก) · a11y (label/aria-invalid/aria-describedby/focus ring) · next build ผ่าน [command-center 2026-09-19]"
      - "F006 Rebalance — app/rebalance/page.tsx ต่อ computeRebalanceGap จริง · states empty(ชวนตั้งเป้า/→F007)/has-data(gap ต่อคลาส ▲▼)/error(เป้ารวม≠100 AC-E01) · a11y · build ผ่าน [command-center 2026-09-19]"
      - "F005 Import — app/import/page.tsx ต่อ importAssets จริง (paste CSV) · รายงานแถว/คอลัมน์ผิด (AC-E01) + ปุ่มตัวอย่าง · build ผ่าน · การเชื่อม Google Sheet/xlsx จริง = Class B [command-center 2026-09-19]"
      - "F008 Login/SSO — app/login/page.tsx + Auth.js (NextAuth v5, JWT session ไม่ผูก DB): src/auth.ts (Google + LINE providers) · app/api/auth/[...nextauth]/route.ts · app/providers.tsx (SessionProvider) + src/components/LogoutButton.tsx · app/dashboard/page.tsx (landing หลัง login, server-protected → ไม่ login เด้ง /login) · middleware.ts (เติม req.auth + guard ที่ comment ไว้) · **Google + LINE login ทดสอบผ่านจริง end-to-end [2026-10-10] — ครบ PRD spec (LINE+Google) + CR-WPN-001** · ปุ่ม logout อยู่ใน topbar ทุกหน้า (/ /add /import /rebalance) + dashboard · email → UI มีแต่ยังไม่เปิด (แจ้งตรงๆ ไม่แกล้งสำเร็จ) · redirect URIs: /api/auth/callback/{google,line} · validation อีเมล+รหัส≥8 · a11y · next build ผ่าน · Apple+X **ถูกเอาออกแล้ว [2026-10-10]** (เคยเกิน spec → ตัดทิ้งให้เหลือ LINE+Google ตาม PRD เป๊ะ) · เปลี่ยนจากแผน Supabase → NextAuth (เจ้าของเลือก ไม่อยากผูก Supabase) · dep: next-auth@5 (ถอน @supabase/*) · creds ใน .env.local (gitignored), AUTH_SECRET สุ่ม · gotcha: restart dev ระหว่าง flow / cookie เก่า → InvalidCheck state → แก้ด้วย incognito/clear cookie [2026-10-10]"
    screens_todo:
      - "F007 Risk (disclaimer gate) — บล็อก Class B (ถ้อยคำ disclaimer กรอบ ก.ล.ต. + BR-07)"
      - "F003 price-status จริง (stale/ดึงราคา) — logic เสร็จ, การดึงจริงบล็อก Class B (O1 ToS) · UI ใช้ mock/ต้นทุนชั่วคราว"
    screens_optional_non_req:
      - "Stock detail — ไม่ใช่ข้อกำหนด F001–F007 (DSN §6 ยืนยัน req มีหน้าครบแล้ว) → นอกเกณฑ์ G4, ทำรอบหน้าได้ ไม่บล็อก"
    remaining_cross_cutting: "nav: topbar → /add /import /rebalance (มี back ทุกหน้า) · ผัง NAV เต็ม (STAGED) ยังไม่ลง · login UI + auth scaffold เสร็จแล้ว (F008) แต่ unauthorized state ทุกหน้า + บังคับ login (middleware guard) = พร้อมเปิดเมื่อมี Supabase creds (Class B) · a11y pass เชิงลึกทั้งแอป"
    blocked_classB: "Supabase creds (data/auth จริง) · O1 ToS (F003/F004 ดึงราคาจริง) · F007 disclaimer wording"

quality:
  wcag: AA                    # ระดับที่ยึด
  browsers: []                # เบราว์เซอร์และรุ่นที่รองรับ — TBD
  design_reference: TBD — ต้องการ [ไฟล์แบบที่ใช้เทียบ]   # ไฟล์แบบที่ใช้เทียบ ถ้าไม่มีให้ระบุว่าไม่มี

release:
  target: TBD — ต้องการ [ปล่อยขึ้นที่ไหน]            # ปล่อยขึ้นที่ไหน
  approver: TBD — ต้องการ [ใครกดปล่อย]               # ใครกดปล่อย
  rollback: TBD — ต้องการ [วิธีถอยกลับ]              # ถอยกลับยังไง ใช้เวลาเท่าไหร่

# ผลการตรวจประตู — เขียนโดย /gate เท่านั้น
