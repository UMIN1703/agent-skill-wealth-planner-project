# ตัวเลขหรือข้อเท็จจริงที่เป็นการเดา ไม่ใช่ของที่รู้จริง
assumptions:
  - text: "baseline เวลารวบรวมพอร์ต 30–60 นาที/เดือน เป็นการประมาณจากความจำ ยังไม่ได้จับเวลาจริง — ต้องจับจริงก่อนสรุปผลลัพธ์หลัง release"
    source: เจ้าของโครงการประมาณเอง (intake)
    raised: 2026-08-22
  - text: "SA ออกแบบ data model โดยสมมติ ~50–200 assets/user, single-user ต่อบัญชี, เก็บราคาล่าสุดไม่เก็บ history (MVP) — รอยืนยัน (SRS A1–A3)"
    source: นักวิเคราะห์ระบบ (analysis)
    raised: 2026-08-22
  - text: "วิธีแก้ที่เจ้าของโครงการเสนอ — ให้ AI เป็นที่ปรึกษาช่วยจัด asset allocation เสมือนมีทีม personal wealth ดูแล โดยอ้างอิงสถานการณ์เศรษฐกิจปัจจุบันและเชื่อมโยงข้อมูลข้ามโบรกได้ เพื่อ 'ทำให้คำปรึกษาเข้าถึงได้' สำหรับคนที่ยังไม่ถึงเกณฑ์ 2 ล้าน หรือไม่อยากผูกกับโบรกเดียว (ยังไม่ผ่านการทบทวนโดย product-owner ว่าใช่วิธีที่ควรสร้าง และยังไม่ได้ประเมินความเสี่ยง/ความรับผิดของการให้คำแนะนำการลงทุนโดย AI)"
    source: เจ้าของโครงการเสนอเอง (intake)
    raised: 2026-08-22
