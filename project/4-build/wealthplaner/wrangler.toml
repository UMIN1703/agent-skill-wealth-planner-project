# Cloudflare Pages (next-on-pages) — F008 deploy
name = "wealthplaner"
pages_build_output_dir = ".vercel/output/static"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ให้ NextAuth เชื่อ host ของ Cloudflare (จำเป็นบน Pages)
[vars]
AUTH_TRUST_HOST = "true"

# Secrets/vars (AUTH_SECRET, AUTH_GOOGLE_ID/SECRET, AUTH_LINE_ID/SECRET, AUTH_TRUST_HOST,
#   F009: LINE_CHANNEL_SECRET, LINE_CHANNEL_ACCESS_TOKEN, SLIP_STAGING)
# ตั้งใน Cloudflare dashboard (Settings → Environment variables) หรือ `wrangler pages secret put`
# — อย่าใส่ค่าจริงในไฟล์นี้

# F009 Slip-to-Ledger (CR-WPN-002) — staging: KV อย่างเดียว (index + ไบต์รูป)
# เก็บรูปใน KV แทน R2 → ฟรี 100% ไม่ต้องผูกบัตร (slipStore.ts)
[[kv_namespaces]]
binding = "SLIP_INDEX"
id = "59141c63a3f74976bd4dbc892f7312cb"

# R2 (รูปสลิป) — ไม่ใช้แล้ว (ย้ายไป KV) · ถ้าจะกลับมาใช้ R2 ต้องผูกบัตร:
# [[r2_buckets]]
# binding = "SLIP_FILES"
# bucket_name = "wpn-slips"
